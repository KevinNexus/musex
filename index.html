<!DOCTYPE html>
<html lang="zh-CN" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MuseX — X Creator Discovery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        dark: { 900: '#0f172a', 800: '#1e293b', 700: '#334155' },
                        brand: { 500: '#6366f1', 600: '#4f46e5' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .card-hover { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .card-hover:hover { transform: translateY(-4px); box-shadow: 0 20px 40px -15px rgba(99, 102, 241, 0.4); border-color: rgba(99, 102, 241, 0.5); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-dark-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div>
                    <div class="flex items-center gap-2 mb-1">
                        <span class="text-xs font-bold tracking-widest text-brand-500 uppercase">Curated Discovery Vault</span>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                        X 博主精选画廊
                    </h1>
                    <p class="text-sm text-slate-400 mt-1">
                        高品质 X (Twitter) 创作者画廊 · 去重备份 · 实时探索与智能推荐 
                        <span class="text-slate-500 mx-2">|</span> 
                        <span class="text-brand-500">策展人 · MuseX Team</span>
                    </p>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="changeSpotlight()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 transition text-sm font-medium">
                        <i class="fa-solid fa-shuffle text-brand-500"></i> Random ↗
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full space-y-8">

        <!-- Stats Bar -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="glass rounded-xl p-4 text-center">
                <div class="text-2xl font-bold text-white" id="stat-total">0</div>
                <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">归档总数</div>
            </div>
            <div class="glass rounded-xl p-4 text-center">
                <div class="text-2xl font-bold text-blue-400" id="stat-verified">0</div>
                <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">蓝标认证</div>
            </div>
            <div class="glass rounded-xl p-4 text-center">
                <div class="text-2xl font-bold text-brand-500" id="stat-top">0</div>
                <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">Top 头部</div>
            </div>
            <div class="glass rounded-xl p-4 text-center">
                <div class="text-2xl font-bold text-emerald-400" id="stat-max-fans">0</div>
                <div class="text-xs text-slate-400 uppercase tracking-wider mt-1">最高粉丝</div>
            </div>
        </div>

        <!-- Today's Feature -->
        <section class="glass rounded-2xl p-6 md:p-8 relative overflow-hidden">
            <div class="absolute top-0 right-0 w-64 h-64 bg-brand-500/10 rounded-full blur-3xl -mr-16 -mt-16 pointer-events-none"></div>
            <div class="flex flex-col md:flex-row items-start md:items-center justify-between mb-6 gap-4">
                <div>
                    <h2 class="text-xl font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-star text-yellow-400"></i> 今日精选 Spotlight
                    </h2>
                    <p class="text-slate-400 text-sm mt-1">One profile worth discovering</p>
                </div>
                <button onclick="changeSpotlight()" class="text-sm text-brand-400 hover:text-brand-300 flex items-center gap-2 transition">
                    <i class="fa-solid fa-rotate"></i> 换一位推荐
                </button>
            </div>
            <div id="spotlight-container" class="fade-in">
                <!-- Spotlight content injected by JS -->
            </div>
        </section>

        <!-- Controls: Search, Filter, Sort -->
        <section class="space-y-4">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center">
                <!-- Search -->
                <div class="relative w-full md:w-96 group">
                    <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-brand-500 transition"></i>
                    <input type="text" id="searchInput" placeholder="搜索创作者 (按 / 聚焦)..." 
                        class="w-full bg-slate-800/50 border border-slate-700 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition">
                </div>
                
                <!-- Sort -->
                <div class="relative">
                    <select id="sortSelect" class="appearance-none bg-slate-800/50 border border-slate-700 rounded-xl py-2.5 pl-4 pr-10 text-sm text-white focus:outline-none focus:border-brand-500 cursor-pointer">
                        <option value="followersDesc">粉丝数从高到低</option>
                        <option value="followersAsc">粉丝数从低到高</option>
                        <option value="nameAsc">博主名称 (A → Z)</option>
                        <option value="dateDesc">最新归档</option>
                    </select>
                    <i class="fa-solid fa-chevron-down absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 pointer-events-none text-xs"></i>
                </div>
            </div>

            <!-- Filter Tabs -->
            <div class="flex gap-2 overflow-x-auto scrollbar-hide pb-2" id="filterTabs">
                <button data-filter="all" class="filter-btn active px-4 py-1.5 rounded-full text-sm font-medium bg-brand-600 text-white transition whitespace-nowrap">全部 <span class="opacity-70 text-xs" id="count-all">0</span></button>
                <button data-filter="popular" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition whitespace-nowrap">热度排行 <span class="opacity-70 text-xs" id="count-popular">0</span></button>
                <button data-filter="verified" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition whitespace-nowrap">蓝标认证 <span class="opacity-70 text-xs" id="count-verified">0</span></button>
                <button data-filter="top" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition whitespace-nowrap">Top 头部 <span class="opacity-70 text-xs" id="count-top">0</span></button>
                <button data-filter="new" class="filter-btn px-4 py-1.5 rounded-full text-sm font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 border border-slate-700 transition whitespace-nowrap">最新归档 <span class="opacity-70 text-xs" id="count-new">0</span></button>
            </div>
        </section>

        <!-- Creator Grid -->
        <section>
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold text-white">创作者画廊 <span class="text-slate-500 text-sm font-normal ml-2" id="result-count"></span></h3>
            </div>
            <div id="creatorGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4">
                <!-- Cards injected by JS -->
            </div>
            <div id="emptyState" class="hidden text-center py-16">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-800 mb-4">
                    <i class="fa-solid fa-wind text-2xl text-slate-500"></i>
                </div>
                <h3 class="text-lg font-medium text-white">未找到匹配的博主</h3>
                <p class="text-slate-400 text-sm mt-1">没有匹配到任何符合搜索条件或分类的博主，您可以尝试清除关键词。</p>
                <button onclick="resetFilters()" class="mt-4 px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-sm transition">重置筛选条件</button>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-dark-900 py-6 mt-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 text-sm">© 2026 MuseX · X Creator Discovery</p>
            <div class="flex items-center justify-center gap-4 mt-2 text-xs text-slate-600">
                <span><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-400">/</kbd> 搜索</span>
                <span><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-400">R</kbd> 随机推荐</span>
                <span><kbd class="px-1.5 py-0.5 bg-slate-800 rounded border border-slate-700 text-slate-400">ESC</kbd> 关闭弹窗</span>
            </div>
        </div>
    </footer>

    <!-- Modal -->
    <div id="profileModal" class="fixed inset-0 z-50 hidden">
        <div class="absolute inset-0 bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full max-w-lg p-4">
            <div class="glass rounded-2xl p-6 relative fade-in shadow-2xl shadow-brand-500/10">
                <button onclick="closeModal()" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-slate-800 hover:bg-slate-700 text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-xmark"></i>
                </button>
                <div id="modalContent" class="text-center">
                    <!-- Modal content injected by JS -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- 1. Mock Data (模拟数据) ---
        const creators = [
            { id: 1, name: "Naimi", handle: "@Anaimiya", followers: "4.3M", fansNum: 4300000, verified: true, category: "top", bio: "Digital Artist & Content Creator. All my works linked below.", link: "#", location: "Tokyo, JP", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Naimi&backgroundColor=b6e3f4" },
            { id: 2, name: "Kunkun", handle: "@kunkunkun188", followers: "1.9M", fansNum: 1900000, verified: true, category: "top", bio: "Daily life and creative updates. Check my links for more exclusive content.", link: "#", location: "Malaysia", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Kunkun&backgroundColor=c0aede" },
            { id: 3, name: "Joycelyn", handle: "@Joycelyn52011", followers: "1.1M", fansNum: 1100000, verified: true, category: "top", bio: "Lifestyle creator. Unlock more exclusive content and updates.", link: "#", location: "Taipei, TW", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Joycelyn&backgroundColor=ffdfbf" },
            { id: 4, name: "Pupu", handle: "@waifupupu", followers: "3.3M", fansNum: 3300000, verified: true, category: "top", bio: "You look lonely, I can fix that. Official links and updates below.", link: "#", location: "Cyber City", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Pupu&backgroundColor=ffd5dc" },
            { id: 5, name: "June", handle: "@SpicygumL", followers: "1.8M", fansNum: 1800000, verified: true, category: "popular", bio: "Check my links. Updates and DM info available below.", link: "#", location: "Seoul, KR", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=June&backgroundColor=d1d4f9" },
            { id: 6, name: "Ququ", handle: "@ququ999999", followers: "1.2M", fansNum: 1200000, verified: true, category: "popular", bio: "Original content creator. Check linktree for all contacts.", link: "#", location: "Unknown", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Ququ&backgroundColor=c0aede" },
            { id: 7, name: "Fortune", handle: "@FortuneCutie00", followers: "1.3M", fansNum: 1300000, verified: true, category: "top", bio: "Your asian petite fantasy. Official links and daily updates.", link: "#", location: "Online", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Fortune&backgroundColor=b6e3f4" },
            { id: 8, name: "Yuki", handle: "@SxeYuki", followers: "1.1M", fansNum: 1100000, verified: true, category: "popular", bio: "Daily updates. Beware of fake accounts. Only trust this handle.", link: "#", location: "Traveling", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Yuki&backgroundColor=ffdfbf" },
            { id: 9, name: "Kitty", handle: "@kitty2002102", followers: "961K", fansNum: 961000, verified: true, category: "verified", bio: "Original content. 19 years old. Check linktree for more.", link: "#", location: "Online", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Kitty&backgroundColor=ffd5dc" },
            { id: 10, name: "Minmin", handle: "@wenwen0006", followers: "7.9K", fansNum: 7900, verified: false, category: "new", bio: "Freelance model. Natural and authentic. DM for collabs.", link: "#", location: "Guangzhou, CN", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Minmin&backgroundColor=d1d4f9" },
            { id: 11, name: "Jingxiang", handle: "@DLjingxiang", followers: "1.0M", fansNum: 1000000, verified: true, category: "popular", bio: "Lifestyle and fashion content creator.", link: "#", location: "Shanghai, CN", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=Jingxiang&backgroundColor=c0aede" },
            { id: 12, name: "HK Doll", handle: "@HongKong_Doll", followers: "3.2M", fansNum: 3200000, verified: true, category: "top", bio: "All Works & DM subscription guide. Official links only.", link: "#", location: "Hong Kong", avatar: "https://api.dicebear.com/7.x/avataaars/svg?seed=HKDoll&backgroundColor=b6e3f4" }
        ];

        // --- 2. State Management ---
        let state = {
            filter: 'all',
            sort: 'followersDesc',
            search: ''
        };

        // --- 3. Helper Functions ---
        function parseFans(fansStr) {
            if (fansStr.includes('M')) return parseFloat(fansStr) * 1000000;
            if (fansStr.includes('K')) return parseFloat(fansStr) * 1000;
            return parseInt(fansStr) || 0;
        }

        function formatNumber(num) {
            if (num >= 1000000) return (num / 1000000).toFixed(1) + 'M';
            if (num >= 1000) return (num / 1000).toFixed(0) + 'K';
            return num.toString();
        }

        // --- 4. Render Functions ---
        function renderStats() {
            document.getElementById('stat-total').textContent = creators.length.toLocaleString();
            document.getElementById('stat-verified').textContent = creators.filter(c => c.verified).length.toLocaleString();
            document.getElementById('stat-top').textContent = creators.filter(c => c.category === 'top').length.toLocaleString();
            const maxFans = Math.max(...creators.map(c => c.fansNum));
            document.getElementById('stat-max-fans').textContent = formatNumber(maxFans);
            
            // Update tab counts
            document.getElementById('count-all').textContent = creators.length;
            document.getElementById('count-popular').textContent = creators.filter(c => c.category === 'popular').length;
            document.getElementById('count-verified').textContent = creators.filter(c => c.verified).length;
            document.getElementById('count-top').textContent = creators.filter(c => c.category === 'top').length;
            document.getElementById('count-new').textContent = creators.filter(c => c.category === 'new').length;
        }

        function renderSpotlight() {
            const randomCreator = creators[Math.floor(Math.random() * creators.length)];
            const container = document.getElementById('spotlight-container');
            container.innerHTML = `
                <div class="flex flex-col sm:flex-row items-start sm:items-center gap-6">
                    <img src="${randomCreator.avatar}" alt="${randomCreator.name}" class="w-20 h-20 rounded-full border-2 border-brand-500 shadow-lg shadow-brand-500/20">
                    <div class="flex-grow">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="text-xl font-bold text-white">${randomCreator.name}</h3>
                            ${randomCreator.verified ? '<i class="fa-solid fa-certificate text-blue-400 text-sm" title="Verified"></i>' : ''}
                            <span class="text-xs px-2 py-0.5 rounded-full bg-brand-500/20 text-brand-400 border border-brand-500/30">${randomCreator.category.toUpperCase()}</span>
                        </div>
                        <p class="text-slate-400 text-sm mb-2">${randomCreator.handle} · <span class="text-white font-medium">${randomCreator.followers}</span> 关注者</p>
                        <p class="text-slate-300 text-sm leading-relaxed mb-3">${randomCreator.bio}</p>
                        <div class="flex items-center gap-4 text-xs text-slate-500">
                            ${randomCreator.location ? `<span><i class="fa-solid fa-location-dot mr-1"></i>${randomCreator.location}</span>` : ''}
                        </div>
                    </div>
                    <div class="flex gap-3 w-full sm:w-auto">
                        <button onclick="openModal(${randomCreator.id})" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-white text-sm font-medium transition">时光档案</button>
                        <a href="${randomCreator.link}" target="_blank" class="flex-1 sm:flex-none px-5 py-2.5 rounded-xl bg-white text-dark-900 hover:bg-slate-200 text-sm font-bold transition text-center">访问 X <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i></a>
                    </div>
                </div>
            `;
        }

        function getFilteredAndSortedCreators() {
            let result = [...creators];
            
            // Filter
            if (state.filter === 'popular') result = result.filter(c => c.category === 'popular' || c.fansNum > 1000000);
            else if (state.filter === 'verified') result = result.filter(c => c.verified);
            else if (state.filter === 'top') result = result.filter(c => c.category === 'top');
            else if (state.filter === 'new') result = result.filter(c => c.category === 'new');

            // Search
            if (state.search) {
                const q = state.search.toLowerCase();
                result = result.filter(c => c.name.toLowerCase().includes(q) || c.handle.toLowerCase().includes(q) || c.bio.toLowerCase().includes(q));
            }

            // Sort
            result.sort((a, b) => {
                if (state.sort === 'followersDesc') return b.fansNum - a.fansNum;
                if (state.sort === 'followersAsc') return a.fansNum - b.fansNum;
                if (state.sort === 'nameAsc') return a.name.localeCompare(b.name);
                if (state.sort === 'dateDesc') return b.id - a.id;
                return 0;
            });

            return result;
        }

        function renderGrid() {
            const result = getFilteredAndSortedCreators();
            const grid = document.getElementById('creatorGrid');
            const emptyState = document.getElementById('emptyState');
            const resultCount = document.getElementById('result-count');

            resultCount.textContent = `共呈现 ${result.length} 位博主归档`;

            if (result.length === 0) {
                grid.innerHTML = '';
                emptyState.classList.remove('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            grid.innerHTML = result.map(c => `
                <div class="glass rounded-xl p-5 card-hover cursor-pointer group" onclick="openModal(${c.id})">
                    <div class="flex items-start justify-between mb-3">
                        <img src="${c.avatar}" alt="${c.name}" class="w-12 h-12 rounded-full border border-slate-700 group-hover:border-brand-500 transition">
                        ${c.verified ? '<i class="fa-solid fa-certificate text-blue-400" title="Verified"></i>' : ''}
                    </div>
                    <h4 class="font-bold text-white text-lg mb-0.5 group-hover:text-brand-400 transition">${c.name}</h4>
                    <p class="text-slate-500 text-sm mb-3">${c.handle} · <span class="text-slate-300">${c.followers}</span> 关注者</p>
                    <p class="text-slate-400 text-sm line-clamp-2 mb-4 h-10">${c.bio}</p>
                    <div class="flex gap-2 pt-3 border-t border-slate-700/50">
                        <button class="flex-1 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-xs font-medium text-slate-300 transition">档案</button>
                        <a href="${c.link}" target="_blank" onclick="event.stopPropagation()" class="flex-1 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-500 text-xs font-bold text-white text-center transition">访问 X</a>
                    </div>
                </div>
            `).join('');
        }

        // --- 5. Modal Functions ---
        function openModal(id) {
            const c = creators.find(x => x.id === id);
            if (!c) return;
            
            document.getElementById('modalContent').innerHTML = `
                <img src="${c.avatar}" alt="${c.name}" class="w-24 h-24 rounded-full border-4 border-slate-800 mx-auto mb-4 shadow-xl">
                <h2 class="text-2xl font-bold text-white mb-1">${c.name} ${c.verified ? '<i class="fa-solid fa-certificate text-blue-400 text-lg ml-1"></i>' : ''}</h2>
                <p class="text-brand-400 font-medium mb-4">${c.handle}</p>
                
                <div class="flex justify-center gap-6 mb-6 text-sm">
                    <div class="text-center">
                        <div class="font-bold text-white text-lg">${c.followers}</div>
                        <div class="text-slate-500 text-xs">关注者</div>
                    </div>
                    <div class="text-center">
                        <div class="font-bold text-white text-lg">${c.category.toUpperCase()}</div>
                        <div class="text-slate-500 text-xs">分类</div>
                    </div>
                </div>

                <div class="bg-slate-800/50 rounded-xl p-4 mb-6 text-left">
                    <p class="text-slate-300 text-sm leading-relaxed mb-2">${c.bio}</p>
                    ${c.location ? `<p class="text-slate-500 text-xs"><i class="fa-solid fa-location-dot mr-1"></i>${c.location}</p>` : ''}
                </div>

                <div class="flex flex-col sm:flex-row gap-3">
                    <a href="${c.link}" target="_blank" class="flex-1 py-3 rounded-xl bg-white text-dark-900 font-bold hover:bg-slate-200 transition text-center">
                        直达 X 个人主页 <i class="fa-solid fa-arrow-up-right-from-square ml-1"></i>
                    </a>
                    <button onclick="changeSpotlight(); closeModal();" class="flex-1 py-3 rounded-xl bg-slate-800 text-white font-medium hover:bg-slate-700 border border-slate-700 transition">
                        再抽一次 (按 R)
                    </button>
                </div>
                <p class="text-slate-600 text-xs mt-4">按 ESC 或点击任意空白处关闭</p>
            `;
            document.getElementById('profileModal').classList.remove('hidden');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('profileModal').classList.add('hidden');
            document.body.style.overflow = '';
        }

        // --- 6. Event Listeners ---
        function changeSpotlight() {
            // Add a quick fade out/in effect
            const container = document.getElementById('spotlight-container');
            container.style.opacity = '0';
            setTimeout(() => {
                renderSpotlight();
                container.style.opacity = '1';
            }, 200);
        }

        function resetFilters() {
            state.filter = 'all';
            state.search = '';
            document.getElementById('searchInput').value = '';
            updateActiveTab();
            renderGrid();
        }

        function updateActiveTab() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.dataset.filter === state.filter) {
                    btn.classList.remove('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                    btn.classList.add('bg-brand-600', 'text-white');
                } else {
                    btn.classList.add('bg-slate-800', 'text-slate-300', 'border', 'border-slate-700');
                    btn.classList.remove('bg-brand-600', 'text-white');
                }
            });
        }

        // Tab clicks
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                state.filter = btn.dataset.filter;
                updateActiveTab();
                renderGrid();
            });
        });

        // Search input
        document.getElementById('searchInput').addEventListener('input', (e) => {
            state.search = e.target.value;
            renderGrid();
        });

        // Sort select
        document.getElementById('sortSelect').addEventListener('change', (e) => {
            state.sort = e.target.value;
            renderGrid();
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
                e.preventDefault();
                document.getElementById('searchInput').focus();
            }
            if ((e.key === 'r' || e.key === 'R') && document.activeElement.tagName !== 'INPUT' && document.getElementById('profileModal').classList.contains('hidden')) {
                e.preventDefault();
                changeSpotlight();
            }
            if (e.key === 'Escape') {
                closeModal();
            }
        });

        // --- 7. Initialization ---
        document.addEventListener('DOMContentLoaded', () => {
            renderStats();
            renderSpotlight();
            renderGrid();
        });
    </script>
</body>
</html>
